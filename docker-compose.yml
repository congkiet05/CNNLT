version: '3.9'

services:
  # ─── SQL Server ───────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: food_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - food_network

  # ─── Auth Service ─────────────────────────────────────────
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: food_auth_service
    environment:
      PORT: 3001
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: food_recipe_db
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - food_network
    restart: unless-stopped

  # ─── Ingredient Service ───────────────────────────────────
  ingredient-service:
    build:
      context: ./services/ingredient-service
      dockerfile: Dockerfile
    container_name: food_ingredient_service
    environment:
      PORT: 3002
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      JWT_SECRET: "${JWT_SECRET}"
      DB_HOST: sqlserver
      DB_PORT: 1433
      DB_NAME: food_recipe_db
      DB_USER: sa
      DB_PASSWORD: "${DB_PASSWORD}"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
    networks:
      - food_network
    restart: unless-stopped

  # ─── API Gateway (Nginx) ──────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: food_gateway
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - ingredient-service
    networks:
      - food_network
    restart: unless-stopped

  # ─── Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: food_frontend
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost/api}"
    ports:
      - "3000:3000"
    networks:
      - food_network
    restart: unless-stopped

volumes:
  sqlserver_data:

networks:
  food_network:
    driver: bridge
