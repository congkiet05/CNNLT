events {
    worker_connections 1024;
}

http {
    # ─── Upstream Services ────────────────────────────────────
    upstream auth_service {
        server auth-service:3001;
    }

    upstream ingredient_service {
        server ingredient-service:3002;
    }

    # ─── Rate Limiting ────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # ─── Server ───────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Tăng giới hạn upload cho ảnh (tối đa 3 ảnh x 10MB)
        client_max_body_size 35M;

        # ─── Auth Service ──────────────────────────────────────
        # Các endpoint public (không cần JWT)
        location ~ ^/api/auth/(register|login|refresh)$ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Các endpoint auth cần JWT
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Xác thực JWT qua auth service
            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;
        }

        # ─── Ingredient Service ────────────────────────────────
        location /api/ingredients/ {
            limit_req zone=api_limit burst=10 nodelay;

            # Xác thực JWT
            auth_request /auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $user_role $upstream_http_x_user_role;

            # Xử lý lỗi 401 từ auth_request
            error_page 401 = @unauthorized;

            proxy_pass http://ingredient_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header X-User-Role $user_role;

            # Timeout dài hơn cho Gemini AI (có thể mất vài giây)
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
        # ─── Internal: JWT Validation ─────────────────────────
        # Endpoint nội bộ để nginx xác thực JWT
        location = /auth/validate {
            internal;
            proxy_pass http://auth_service/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }

        # ─── Error Handlers ───────────────────────────────────
        location @unauthorized {
            return 401 '{"success":false,"message":"Token không hợp lệ hoặc đã hết hạn"}';
            add_header Content-Type application/json;
        }

        # Health check
        location /health {
            return 200 '{"status":"ok","service":"gateway"}';
            add_header Content-Type application/json;
        }
    }
}
